<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;background:#0B0D12;color:#EBECEF;font:14px ui-sans-serif,system-ui,sans-serif;display:grid;grid-template-columns:60px 1fr}
.rail{background:#0C0E14;border-right:1px solid #ffffff10;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:18px}.rail i{width:20px;height:20px;border-radius:6px;background:#2a2f3c}.rail i.on{background:#3DD6C6}
.top{height:56px;border-bottom:1px solid #ffffff10}.b{padding:22px;display:grid;grid-template-columns:1.55fr 1fr;gap:12px}
.card{background:#12151C;border:1px solid #ffffff10;border-radius:12px;padding:18px;min-height:180px}h1{font-size:34px;margin:10px 0}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats .card{min-height:90px}
.spark{height:72px;border-radius:8px;background:linear-gradient(#3DD6C61a,transparent)}
</style></head><body><aside class="rail"><i class="on"></i><i></i><i></i><i></i><i></i></aside><main><div class="top"></div><div class="b">
<div class="card"><div style="color:#6f7689">Reserve balance</div><h1>482,913.40</h1><div class="spark"></div></div><div class="card"><div style="color:#a0a6b5">Wallets</div></div>
<div class="stats"><div class="card">Receive 12</div><div class="card">Move 4</div><div class="card">Send 7</div><div class="card">Halt clear</div></div>
<div class="card">Needs attention</div><div class="card">Wallet pool</div></div></main></body></html>
