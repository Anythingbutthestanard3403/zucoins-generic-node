# Prometheus alerting rules for the generic SplitChain custody node.
#
# Scrape target: GET /metrics on the node, Prometheus text exposition
# (`packages/node-core/src/core/metrics.ts` renderMetrics). The route is bearer-gated
# and is NOT MOUNTED AT ALL unless `METRICS_SCRAPE_TOKEN` is configured, so a node
# without that variable produces no data and every rule here stays silent. Give the
# scrape job:
#
#   authorization:
#     type: Bearer
#     credentials_file: /etc/prometheus/gn-metrics-token
#
# `severity` labels match the P0/P1/P2 ladder in
# `packages/node-core/src/operator/safety-alerts.ts`; `signal` labels match
# `SAFETY_ALERT_SIGNALS`. Thresholds are the module's own defaults
# (`DEFAULT_ALERT_THRESHOLDS`) — change them there first, then here.
#
# In-process SAFETY_ALERT_SIGNALS and these rules must agree on thresholds
# (ZTR-1144). Every alert here is advisory. Nothing in this file is permitted to
# trigger automation that releases a lease, retries a submit, or changes money state.

groups:
  - name: generic-node-safety-signals
    interval: 30s
    rules:
      # --- invariant_breach (P0) -------------------------------------------------
      - alert: GenericNodeInvariantBreach
        expr: increase(gn_invariant_breach_total[15m]) >= 1
        for: 0m
        labels:
          severity: P0
          signal: invariant_breach
        annotations:
          summary: "INVARIANT_BREACH classification applied ({{ $value }} in 15m)"
          posture: >-
            Stop money engines, quarantine affected wallets, preserve evidence, operator
            escalation. Do not un-quarantine, do not rebuild, do not retry a submit.
          runbook: docs/operations/incidents.md#invariant_breach

      # --- duplicate_submit_attempt (P0) ----------------------------------------
      - alert: GenericNodeDuplicateSubmitAttempt
        expr: increase(gn_duplicate_submit_rejection_total[15m]) >= 1
        for: 0m
        labels:
          severity: P0
          signal: duplicate_submit_attempt
        annotations:
          summary: "submit_decision_id uniqueness rejection ({{ $value }} in 15m)"
          posture: >-
            Stop money engines, quarantine affected wallets, preserve evidence, operator
            escalation. Alert on uniqueness-constraint rejection only — never on raw retry count.
          runbook: docs/operations/incidents.md#duplicate_submit_attempt

      # --- lease_age (P1, diagnostic only) ---------------------------------------
      - alert: GenericNodeLeaseAge
        expr: gn_oldest_lease_age_seconds >= 300 and on(instance) gn_database_truth_available == 1
        for: 5m
        labels:
          severity: P1
          signal: lease_age
          diagnostic_only: "true"
        annotations:
          summary: "Oldest active lease is {{ $value | humanizeDuration }} old"
          posture: >-
            Diagnostic only: page operator on stale heartbeat_at. Never automatic lease
            release. A lease heartbeat expiring is NOT a lease release — do not clear the
            lease, do not restart the node to "free" it.
          runbook: docs/operations/incidents.md#lease_age

      # --- path_gap (P1) ---------------------------------------------------------
      - alert: GenericNodePathGap
        expr: increase(gn_proof_budget_exhaustion_total[15m]) >= 1
        for: 0m
        labels:
          severity: P1
          signal: path_gap
        annotations:
          summary: "Any-depth verification exhausted its path depth or proof budget"
          posture: >-
            Stop affected wallet/operation, keep other isolated lanes operating if
            invariants hold, operator escalation. An exhausted budget is INDETERMINATE:
            it authorizes no landing, no non-landing, and no retry.
          runbook: docs/operations/incidents.md#path_gap

      # --- regression (P1) -------------------------------------------------------
      - alert: GenericNodeRegression
        expr: increase(gn_observation_anomalies_total{kind="REGRESSION"}[15m]) >= 1
        for: 0m
        labels:
          severity: P1
          signal: regression
        annotations:
          summary: "REGRESSION observation anomalies in the last 15m"
          posture: >-
            Park affected operations; page operator; never release or rebuild.
          runbook: docs/operations/incidents.md#regression

      # --- endpoint_disagreement (P1) --------------------------------------------
      - alert: GenericNodeEndpointDisagreement
        expr: increase(gn_observation_anomalies_total{kind="ENDPOINT_DISAGREEMENT"}[15m]) >= 1
        for: 0m
        labels:
          severity: P1
          signal: endpoint_disagreement
        annotations:
          summary: "GATEWAY_ENDPOINT_DISAGREEMENT recorded"
          posture: >-
            Fail closed for money decisions until the configured authority policy resolves
            disagreement; operator escalation. Switching gateways starts a new observation
            stream and does not erase disagreement.
          runbook: docs/operations/incidents.md#endpoint_disagreement

      # --- queue_caps (P1) ------------------------------------------------------
      # Depth / pool / pinned need DB gauges; 503 is a process counter and must
      # still fire during DB outage (mirrors in-process custody-alerts — ZTR-1144 D3).
      - alert: GenericNodeQueueCaps
        expr: >-
          (
            (gn_receive_queue_depth / clamp_min(gn_pool_cap_total, 1) >= 0.9)
            or (gn_pool_cap_utilization_percent / 100 >= 0.9)
            or (gn_pinned_wallets / clamp_min(gn_total_wallets, 1) >= 0.9)
          )
          and on(instance) gn_database_truth_available == 1
        for: 10m
        labels:
          severity: P1
          signal: queue_caps
        annotations:
          summary: "Receive queue / pool cap / pinned ratio pressure"
          posture: >-
            Stop affected admission/mint path; keep other isolated lanes operating if
            invariants hold; operator escalation.
          runbook: docs/operations/incidents.md#queue_caps

      - alert: GenericNodeReceiveQueueFull503
        expr: increase(gn_receive_queue_full_503_total[15m]) >= 1
        for: 0m
        labels:
          severity: P1
          signal: queue_caps
        annotations:
          summary: "Receive admission returned 503 queue-full (process counter)"
          posture: >-
            Process-local 503 counter — not DB-gated. Stop affected admission/mint path;
            operator escalation. Mirrors in-process queue_caps 503 arm.
          runbook: docs/operations/incidents.md#queue_caps

      # --- signer_loss (P1; P0 when ambiguous in-flight) --------------------------
      - alert: GenericNodeSignerLeadershipLost
        expr: gn_signer_leadership_held == 0 and on(instance) gn_signer_in_flight_ambiguous == 0
        for: 2m
        labels:
          severity: P1
          signal: signer_loss
        annotations:
          summary: "This instance does not hold signer leadership"
          posture: >-
            P1 readiness-degraded when leadership is lost or cannot be re-acquired.
            Unsigned operations stay in their existing public state; no alternate
            instance signs without leadership.
          runbook: docs/operations/incidents.md#signer_loss

      - alert: GenericNodeSignerInFlightAmbiguous
        expr: gn_signer_leadership_held == 0 and on(instance) gn_signer_in_flight_ambiguous == 1
        for: 0m
        labels:
          severity: P0
          signal: signer_loss
        annotations:
          summary: "Leadership lost with in-flight signing still tracked"
          posture: >-
            P0 — in-flight signing outcome is ambiguous. Never retry the sign. Preserve
            evidence; operator escalation.
          runbook: docs/operations/incidents.md#signer_loss

      # --- storage_pressure (P0 band via 0/1 flag) -------------------------------
      - alert: GenericNodeStoragePressure
        expr: gn_storage_pressure == 1
        for: 5m
        labels:
          severity: P0
          signal: storage_pressure
        annotations:
          summary: "Evidence-storage pressure band engaged"
          posture: >-
            Refuse new evidence at pressure; halt operations at critical. Remediation is
            capacity, never deletion — the observation and anomaly ledgers are permanent
            and pruning them to relieve pressure destroys the evidence the system exists
            to keep.
          runbook: docs/operations/incidents.md#storage_pressure

      # --- backup_age (P1) -------------------------------------------------------
      - alert: GenericNodeBackupAge
        expr: gn_backup_last_success_age_seconds >= 86400 and on(instance) gn_backup_last_success_available == 1
        for: 15m
        labels:
          severity: P1
          signal: backup_age
        annotations:
          summary: "Newest successful backup is {{ $value | humanizeDuration }} old"
          posture: >-
            Operator escalation; renew backup before retention/recovery risk.
          runbook: docs/operations/restore.md#backup-cadence

      - alert: GenericNodeBackupNeverSucceeded
        expr: gn_backup_enabled == 1 and on(instance) gn_backup_last_success_available == 0
        for: 1h
        labels:
          severity: P1
          signal: backup_age
        annotations:
          summary: "Backup scheduler is enabled but has never recorded a success"
          posture: >-
            Treat as an unbacked node. Check BACKUP_OUTPUT_DIR is a durable volume (never
            /tmp) and that the pg client binaries probe clean.
          runbook: docs/operations/restore.md#backup-cadence

      - alert: GenericNodeBackupRpoBreached
        expr: gn_backup_rpo_breached == 1
        for: 15m
        labels:
          severity: P1
          signal: backup_age
        annotations:
          summary: "Configured backup RPO is breached"
          runbook: docs/operations/restore.md#backup-cadence

      # --- push_no_transfer_code_streak (P1, ZTR-1154) ---------------------------
      - alert: GenericNodePushNoTransferCodeStreak
        expr: gn_push_no_transfer_code_streak >= 20
        for: 0m
        labels:
          severity: P1
          signal: push_no_transfer_code_streak
        annotations:
          summary: "Push no_transfer_code streak at {{ $value }} (shape-break detector)"
          posture: >-
            Page operator. Compare a freshly decrypted live cleartext against
            goldens/push/delivered-envelope.data.v1; if the nest moved, update
            payload.ts precedence and refresh the golden in the same reviewed commit.
            Do not change the 204 discard response.
          runbook: docs/operations/incidents.md#push_no_transfer_code_streak

      # --- attention_backlog (P1) ------------------------------------------------
      - alert: GenericNodeAttentionBacklog
        expr: gn_operations_attention_required >= 1 and on(instance) gn_database_truth_available == 1
        for: 5m
        labels:
          severity: P1
          signal: attention_backlog
        annotations:
          summary: "{{ $value }} operation(s) require operator attention"
          posture: >-
            Page operator. Drain attention via admin recovery actions; do not release
            leases or rebuild.
          runbook: docs/operations/attention-triage.md

      # --- gateway_read_failure (P1) ---------------------------------------------
      - alert: GenericNodeGatewayReadFailure
        expr: increase(gn_t0_read_failures_total[15m]) >= 1
        for: 0m
        labels:
          severity: P1
          signal: gateway_read_failure
        annotations:
          summary: "Gateway/T0 read failures in the last 15m"
          posture: >-
            Fail closed for money decisions until gateway reads recover. Do not switch
            endpoints to erase disagreement.
          runbook: docs/operations/incidents.md#gateway_read_failure

      # --- queue_oldest_age (P1) ------------------------------------------------
      # Default band 30s matches RECEIVE_QUEUE_MAX_WAIT default; override in deploy if
      # the node config differs.
      - alert: GenericNodeQueueOldestAge
        expr: gn_receive_queue_oldest_age_seconds >= 30 and on(instance) gn_database_truth_available == 1
        for: 5m
        labels:
          severity: P1
          signal: queue_oldest_age
        annotations:
          summary: "Oldest queued receive is {{ $value | humanizeDuration }} old"
          posture: >-
            Stop affected admission path; keep other isolated lanes operating if
            invariants hold; operator escalation.
          runbook: docs/operations/incidents.md#queue_oldest_age

  - name: generic-node-direct-metrics
    interval: 30s
    rules:
      - alert: GenericNodeObservationDegraded
        expr: gn_observation_degraded == 1
        for: 5m
        labels:
          severity: P1
          signal: gateway_read_failure
        annotations:
          summary: "Observation degraded — gateway-read failure budget exceeded"
          posture: >-
            Fail closed for money decisions until the configured authority policy resolves
            it. Switching gateways starts a new observation stream and does not erase a
            disagreement already recorded.
          runbook: docs/operations/incidents.md#gateway_read_failure

      - alert: GenericNodeNotReady
        expr: gn_readiness_ready == 0
        for: 10m
        labels:
          severity: P1
        annotations:
          summary: "Readiness conjunction closed for 10m"
          posture: >-
            Read the boot order in docs/operations/README.md and find the step that did
            not open its gate. Never work around readiness by starting money workers.
          runbook: docs/operations/README.md#boot-order

      - alert: GenericNodeHaltEngaged
        expr: gn_halt_engaged == 1
        for: 0m
        labels:
          severity: P1
        annotations:
          summary: "Operator halt is engaged"
          posture: >-
            Expected during an incident. Unexpected means someone else engaged it —
            find out who and why before clearing it.
          runbook: docs/operations/incidents.md#halt

      - alert: GenericNodeMetricsTargetDown
        expr: up{job=~".*generic-node.*"} == 0
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "Node metrics endpoint is not scrapeable"
          posture: >-
            Every other rule in this file is silent while this fires. Treat a down target
            as unknown state, not as healthy.
