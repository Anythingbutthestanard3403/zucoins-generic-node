      x-zupay-scope: null
      x-zupay-idempotency: NA
components:
  securitySchemes:
    implementerBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: "implementer bearer key. Scopes are resource:action pairs (receive:create, …)."
    signedReportingCredential:
      type: apiKey
      in: header
      name: X-ZP-Reporting-Signature
      description: "signed reporting credential. Companion headers: X-ZP-Reporting-Key-Id, X-ZP-Reporting-Timestamp, X-ZP-Reporting-Expires-At, X-ZP-Reporting-Nonce."
    subscriptionHandle:
      type: apiKey
      in: header
      name: X-ZP-Subscription-Handle
      description: single-operation browser subscription handle.
    operatorSession:
      type: apiKey
      in: cookie
      name: zp_operator_session
      description: operator session. Mutations may additionally require TOTP / device signature.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 255
        pattern: "^[ -~]+$"
      description: Mandatory on every POST mutation. 16–255 visible ASCII chars (IdempotencyKeySchema).
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - request_id
            - details
          properties:
            code:
              type: string
              enum:
                - invalid_api_key
                - not_found
                - unknown_field
                - invalid_scalar
                - malformed_json
                - duplicate_json_key
                - invalid_utf8
                - request_too_large
                - nesting_too_deep
                - invalid_idempotency_key
                - cursor_mismatch
                - unsupported_content_type
                - http_version_too_old
                - idempotency_conflict
                - idempotency_key_reused
                - idempotency_in_progress
                - wallet_busy
                - operation_version_conflict
                - t0_mismatch
                - operation_not_armable
                - verification_material_not_ready
                - verification_material_expired
                - protocol_predicate_failed
                - insufficient_funding_wallet
                - verification_mode_not_allowed
                - verification_mode_mismatch
                - rate_limited
                - receive_queue_full
                - signer_unavailable
                - service_unavailable
            message:
              type: string
              description: Diagnostic only — clients branch on code.
            request_id:
              type: string
              pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
            details:
              type: object
              additionalProperties: true
    OperationObject:
      type: object
      additionalProperties: false
      required:
        - operation_id
        - operation_type
        - state
        - amount_zkz
        - row_version
        - attention_required
        - attention_reason
        - created_at
        - updated_at
        - terminal_at
        - verification_material_available_until
      properties:
        operation_id:
          type: string
          format: uuid
        operation_type:
          type: string
          enum:
            - RECEIVE_EXTERNAL
            - MOVE_INTERNAL
            - SEND_EXTERNAL
          description: Exactly three Layer-1 verbs.
        state:
          type: string
        amount_zkz:
          type: string
          pattern: "^(?=.*[1-9])(0|[1-9][0-9]{0,7})(\\.[0-9]{1,32})?$"
          description: Operation amount (PositiveZkzAmount).
        row_version:
          type: integer
          minimum: 1
        attention_required:
          type: boolean
        attention_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        terminal_at:
          type: string
          format: date-time
          nullable: true
        verification_material_available_until:
          type: string
          format: date-time
          nullable: true
        verification_mode:
          type: string
          enum:
            - INDEPENDENT
            - NODE_VERIFIED
          description: Immutable after admission. Omitted on legacy bodies defaults to INDEPENDENT.
    ExpectedArtifact:
      type: object
      additionalProperties: false
      required:
        - key_id
        - preimage_text
        - preimage_sha256
        - signature
      properties:
        key_id:
          type: string
          format: uuid
        preimage_text:
          type: string
        preimage_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        signature:
          type: string
    ReceiveResponse:
      type: object
      additionalProperties: false
      required:
        - operation
        - receiver_pubkey
        - discriminator
        - expires_at
        - after_landing
        - code_status
        - transfer_code
        - expected_artifact
        - t0
        - subscription_handle
      properties:
        operation:
          $ref: "#/components/schemas/OperationObject"
        receiver_pubkey:
          type: string
          nullable: true
        discriminator:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        after_landing:
          type: object
          additionalProperties: true
        code_status:
          type: string
          enum:
            - NOT_CREATED
            - AWAITING_ARM
            - RELEASED
            - EXPIRED
        transfer_code:
          type: string
          nullable: true
        expected_artifact:
          oneOf:
            - $ref: "#/components/schemas/ExpectedArtifact"
            - type: "null"
        t0:
          type: object
          nullable: true
          additionalProperties: true
        subscription_handle:
          type: string
          minLength: 1
    InternalMoveResponse:
      type: object
      additionalProperties: false
      required:
        - operation
        - source_wallet_id
        - destination_id
        - spawned_from_operation_id
        - lease_status
        - execution_phase
        - expected_artifact
        - source_terminal_observation_id
        - destination_terminal_observation_id
      properties:
        operation:
          $ref: "#/components/schemas/OperationObject"
        source_wallet_id:
          type: string
          format: uuid
        destination_id:
          type: string
          format: uuid
        spawned_from_operation_id:
          type: string
          format: uuid
          nullable: true
        lease_status:
          type: string
          enum:
            - WAITING
            - HELD
            - RELEASED
            - PINNED_FOR_ATTENTION
        execution_phase:
          type: string
          enum:
            - NOT_STARTED
            - PREIMAGE_PERSISTED
            - SIGNED_PERSISTED
            - DELIVERED
            - SUBMIT_STARTED
            - SUBMIT_RETURNED
            - LANDED_VERIFIED
        expected_artifact:
          oneOf:
            - $ref: "#/components/schemas/ExpectedArtifact"
            - type: "null"
        source_terminal_observation_id:
          type: string
          format: uuid
          nullable: true
        destination_terminal_observation_id:
          type: string
          format: uuid
          nullable: true
    ExternalSendResponse:
      type: object
      additionalProperties: false
      required:
        - operation
        - source_wallet_id
        - destination_address
        - references_operation_id
        - approval_status
        - transfer_code
        - transfer_code_sha256
        - available_until
        - expected_artifact
      properties:
        operation:
          $ref: "#/components/schemas/OperationObject"
        source_wallet_id:
          type: string
          format: uuid
        destination_address:
          type: string
        references_operation_id:
          type: string
          format: uuid
          nullable: true
        approval_status:
          type: string
          enum:
            - PENDING
            - CONSUMED
            - REJECTED
        transfer_code:
          type: string
          nullable: true
        transfer_code_sha256:
          type: string
          nullable: true
        available_until:
          type: string
          format: date-time
          nullable: true
          description: Derived redemption-expiry projection; null until post-approval sign intent forms.
        expected_artifact:
          oneOf:
            - $ref: "#/components/schemas/ExpectedArtifact"
            - type: "null"
    DestinationResponse:
      type: object
      additionalProperties: false
      required:
        - destination_id
        - node_id
        - wallet_id
        - wallet_public_key
        - state
        - label
        - blessed_at
        - blessed_by_device_key_id
        - blessing_artifact_id
        - retired_at
        - created_at
      properties:
        destination_id:
          type: string
          format: uuid
        node_id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        wallet_public_key:
          type: string
        state:
          type: string
          enum:
            - PENDING
            - BLESSED
            - RETIRED
            - WORKER
        label:
          type: string
        blessed_at:
          type: string
          format: date-time
          nullable: true
        blessed_by_device_key_id:
          type:
            - string
            - "null"
          format: uuid
        blessing_artifact_id:
          type:
            - string
            - "null"
          format: uuid
        retired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        move_eligible:
          type: boolean
        ineligibility_reason:
          type: string
          nullable: true
    DestinationListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - next_after
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DestinationResponse"
        next_after:
          type:
            - string
            - "null"
          format: uuid
    DiscoveryResponse:
      type: object
      additionalProperties: false
      required:
        - node_id
        - api_version
        - supported_operation_types
        - event_signing_public_keys
        - expected_artifact_public_keys
        - canonical_suite_versions
        - key_validity_intervals
        - funding_wallet_id
        - funding_wallet_public_key
      properties:
        node_id:
          type: string
          format: uuid
        api_version:
          type: string
        supported_operation_types:
          type: array
          items:
            type: string
            enum:
              - RECEIVE_EXTERNAL
              - MOVE_INTERNAL
              - SEND_EXTERNAL
        event_signing_public_keys:
          type: array
          items:
            type: object
        expected_artifact_public_keys:
          type: array
          items:
            type: object
        canonical_suite_versions:
          type: array
          items:
            type: string
        key_validity_intervals:
          type: array
          items:
            type: object
        funding_wallet_id:
          type:
            - string
            - "null"
          format: uuid
        funding_wallet_public_key:
          type:
            - string
            - "null"
    LivenessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - timestamp
      properties:
        status:
          type: string
          enum:
            - alive
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - timestamp
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
            - degraded
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        checks:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - name
              - ready
              - gating
            properties:
              name:
                type: string
              ready:
                type: boolean
              gating:
                type: boolean
    CreateReceiveBody:
      type: object
      additionalProperties: false
      required:
        - amount_zkz
        - anchor
        - after_landing
      properties:
        amount_zkz:
          type: string
          pattern: "^(?=.*[1-9])(0|[1-9][0-9]{0,7})(\\.[0-9]{1,32})?$"
          description: "Positive ZKZ decimal string: canonical grammar ^(0|[1-9][0-9]{0,7})(\\.[0-9]{1,32})?$ with exclusive upper bound < 1e8, ≤32 dp, and numerically > 0 (zeros rejected)."
        anchor:
          type: string
          pattern: "^[A-Za-z0-9_-]{1,96}$"
          description: Opaque implementer anchor bound into the expected artifact.
        expires_in_seconds:
          type: integer
          minimum: 1
          maximum: 59999880
          description: Optional TTL hint; node-clamped to RECEIVE_TTL_MIN/MAX. Hard ceiling is SPLITCHAIN_FUTURE_TIME_CEILING_SECS — matches CreateReceiveBody Zod max.
        after_landing:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - kind
                - destination_id
              properties:
                kind:
                  type: string
                  const: HOLD
                destination_id:
                  type: "null"
            - type: object
              additionalProperties: false
              required:
                - kind
                - destination_id
              properties:
                kind:
                  type: string
                  const: INTERNAL_MOVE
                destination_id:
                  type: string
                  pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                  description: Lowercase canonical UUID (RFC 4122 hex form).
        verification_mode:
          type: string
          enum:
            - INDEPENDENT
            - NODE_VERIFIED
          description: Per-operation verification mode. Omitted defaults to INDEPENDENT. NODE_VERIFIED requires operator policy ops.allow_node_verified for the calling implementer; otherwise 422 verification_mode_not_allowed.
  responses:
    BadRequest:
      description: "Malformed JSON, invalid scalar, unknown field, or impossible shape."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing/invalid/expired authentication. Scope denial collapses to the same 401 (no 403).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Object absent or outside the authenticated tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Idempotency or concurrent-state conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Gone:
      description: Verification-material access window expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnprocessableEntity:
      description: Well-formed request fails a custody/protocol predicate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    TooManyRequests:
      description: Principal rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: "Bounded queue full, signer leadership unavailable, or required gateway evidence unavailable."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
x-zupay-frozen:
  operation_kinds:
    - RECEIVE_EXTERNAL
    - MOVE_INTERNAL
    - SEND_EXTERNAL
  retired_routes:
    - "/v1/reservations*"
    - "/v1/outbound-requests*"
    - "/v1/payments*"
    - "/v1/refunds*"
    - "/admin/v1/drains*"
  retired_routes_non_path_category: any import endpoint
  public_route_count: 20
  admin_route_count: 8
  money_moving_create_paths:
    - /v1/receives
    - /v1/internal-moves
    - /v1/external-sends
