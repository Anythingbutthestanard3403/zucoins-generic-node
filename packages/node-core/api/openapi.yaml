          description: Wallet assigned and T0 formed synchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveResponse"
        "202":
          description: Accepted into bounded receive queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      x-zupay-auth-classes:
        - IMPLEMENTER_BEARER
      x-zupay-scope: "receive:create"
      x-zupay-idempotency: REQUIRED
  "/v1/receives/{operation_id}":
