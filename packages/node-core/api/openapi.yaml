  /v1/receives:
    post:
      tags:
        - Operations
      operationId: postV1Receives
      summary: Create a RECEIVE_EXTERNAL operation
      security:
        - implementerBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - amount_zkz
                - anchor
                - after_landing
              properties:
                amount_zkz:
                  type: string
                  pattern: "^(?=.*[1-9])(0|[1-9][0-9]{0,7})(\\.[0-9]{1,32})?$"
                  description: "Positive ZKZ decimal string: canonical grammar ^(0|[1-9][0-9]{0,7})(\\.[0-9]{1,32})?$ with exclusive upper bound < 1e8, ≤32 dp, and numerically > 0 (zeros rejected)."
                anchor:
                  type: string
                  pattern: "^[A-Za-z0-9_-]{1,96}$"
                  description: Opaque implementer anchor bound into the expected artifact.
                expires_in_seconds:
                  type: integer
                  minimum: 1
                  maximum: 59999880
                  description: Optional TTL hint; node-clamped to RECEIVE_TTL_MIN/MAX. Hard ceiling is SPLITCHAIN_FUTURE_TIME_CEILING_SECS — matches CreateReceiveBody Zod max.
                after_landing:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required:
                        - kind
                        - destination_id
                      properties:
                        kind:
                          type: string
                          const: HOLD
                        destination_id:
                          type: "null"
                    - type: object
                      additionalProperties: false
                      required:
                        - kind
                        - destination_id
                      properties:
                        kind:
                          type: string
                          const: INTERNAL_MOVE
                        destination_id:
                          type: string
                          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
                          description: Lowercase canonical UUID (RFC 4122 hex form).
                verification_mode:
                  type: string
                  enum:
                    - INDEPENDENT
                    - NODE_VERIFIED
                  description: Per-operation verification mode. Omitted defaults to INDEPENDENT. NODE_VERIFIED requires operator policy ops.allow_node_verified for the calling implementer; otherwise 422 verification_mode_not_allowed.
      responses:
